[package]
name = "av-library-manager"
version = "0.13.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry"] }
sha2 = "0.10"
notify = "8.2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[features]
e2e = []
